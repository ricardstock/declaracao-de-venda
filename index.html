<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declaração de Venda</title>
  
  <link rel="stylesheet" href="style.css">
  
  <!-- intl-tel-input CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="page-wrapper">
    <!-- Cabeçalho -->
    <header class="main-header">
      <h1>Declaração de Venda</h1>
      <div class="lang-selector">
        <span>🌐</span>
        <select>
          <option>Português</option>
        </select>
      </div>
    </header>

    <form id="declaracao-form">
      <!-- Cartão 1: Informações Pessoais -->
      <div class="form-card">
        <h2>Informações Pessoais</h2>
        
        <div class="grid-2">
          <input type="text" id="nome" placeholder="Nome Completo" required>
          <input type="text" id="nif" placeholder="NIF" required>
        </div>

        <div class="input-group-wrapper">
          <label class="field-label">Contacto Telefónico</label>
          <div class="phone-container">
            <input type="tel" id="telefone" placeholder="912 345 678">
          </div>
        </div>

        <div class="input-group-wrapper">
          <input type="email" id="email" placeholder="Endereço de Email">
        </div>

        <div class="input-group-wrapper">
          <input type="text" id="morada" placeholder="Morada Completa" required>
        </div>

        <div class="input-group-wrapper">
          <label class="field-label">País de Residência</label>
          <div class="country-container">
            <select id="pais" class="country-select">
              <option value="Portugal" selected>🇵🇹 Portugal</option>
              <option value="Espanha">🇪🇸 Espanha</option>
              <option value="França">🇫🇷 França</option>
              <option value="Alemanha">🇩🇪 Alemanha</option>
              <option value="Reino Unido">🇬🇧 Reino Unido</option>
              <option value="Itália">🇮🇹 Itália</option>
              <option value="Suíça">🇨🇭 Suíça</option>
              <option value="Bélgica">🇧🇪 Bélgica</option>
              <option value="Países Baixos">🇳🇱 Países Baixos</option>
              <option value="Brasil">🇧🇷 Brasil</option>
              <option value="Angola">🇦🇴 Angola</option>
              <option value="Moçambique">🇲🇿 Moçambique</option>
              <option value="Outro">Outro País</option>
            </select>
          </div>
        </div>

        <div class="grid-2" style="margin-top: 16px;">
          <input type="text" id="codigo_postal" placeholder="Código Postal" required>
          <input type="text" id="cidade" placeholder="Cidade" required>
        </div>
      </div>

      <!-- Cartão 2: Produto(s) Vendido(s) -->
      <div class="form-card">
        <h2>Produto(s) Vendido(s)</h2>
        <div id="produtos-container">
          <div class="product-item">
            <div class="product-row">
              <input type="number" class="p-qtd" placeholder="1" value="1" min="1" required>
              <input type="text" class="p-sku" placeholder="SKU / Ref">
              <input type="text" class="p-modelo" placeholder="Marca, Modelo e Cor" required>
              <input type="text" class="p-tamanho" placeholder="Tamanho">
              <input type="number" step="0.01" class="p-valor" placeholder="Valor (€)" required>
            </div>
            <label class="checkbox-label">
              <input type="checkbox" class="p-declaracao" required>
              <span>Declaro que sou um vendedor particular e que os produtos vendidos são bens usados, não tendo sido liquidado IVA nesta venda</span>
            </label>
          </div>
        </div>

        <button type="button" id="btn-adicionar-produto" class="btn-secondary">+ Adicionar Outro Produto</button>
      </div>

      <!-- Cartão 3: Assinatura Digital -->
      <div class="form-card">
        <h2>Assinatura Digital</h2>
        
        <div class="sig-date-row">
          <span>Data da Declaração:</span>
          <div class="date-group">
            <input type="date" id="data_declaracao" required>
          </div>
        </div>
        
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">Desenhe a sua assinatura no espaço abaixo:</p>
        
        <div class="canvas-container">
          <canvas id="signature-pad"></canvas>
        </div>
        
        <button type="button" id="btn-limpar-assinatura" class="btn-small">Limpar Assinatura</button>
      </div>

      <button type="submit" id="btn-submeter" class="btn-primary">Submeter Declaração Oficial</button>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
