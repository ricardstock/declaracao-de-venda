<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declaração de Venda</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="page-wrapper">
    <!-- Cabeçalho Principal -->
    <header class="main-header">
      <h1>Declaração de Venda</h1>
      <div class="lang-selector">
        <span>🌐</span>
        <select>
          <option>Português</option>
        </select>
      </div>
    </header>

    <form id="declaracao-form">
      <!-- Informações Pessoais -->
      <div class="form-card">
        <h2>Informações Pessoais</h2>
        
        <div class="grid-2">
          <div>
            <input type="text" id="nome" placeholder="Nome Completo" required>
          </div>
          <div>
            <input type="text" id="nif" placeholder="NIF" required>
          </div>
        </div>

        <div class="input-group-wrapper">
          <label class="field-label">Contacto Telefónico</label>
          <div style="display: flex; border: 1.5px solid var(--border-color); border-radius: 10px; overflow: hidden; background: #fafafa;">
            <div style="padding: 12px 14px; background: #f1f5f9; border-right: 1.5px solid var(--border-color); display: flex; align-items: center; gap: 6px;">
              <span>🇵🇹</span> <span>▾</span>
            </div>
            <input type="tel" id="telefone" placeholder="912 345 678" style="border: none; margin-bottom: 0; background: transparent;">
          </div>
        </div>

        <div class="input-group-wrapper">
          <input type="email" id="email" placeholder="Endereço de Email">
        </div>

        <div class="input-group-wrapper">
          <input type="text" id="morada" placeholder="Morada Completa" required>
        </div>

        <div class="input-group-wrapper">
          <label class="field-label">País de Residência</label>
          <div style="display: flex; border: 1.5px solid var(--border-color); border-radius: 10px; overflow: hidden; background: #fafafa; padding: 12px 16px; align-items: center; gap: 8px;">
            <span>🇵🇹</span>
            <select id="pais" style="border: none; background: transparent; width: 100%; outline: none; font-size: 14px; color: var(--text-main); font-weight: 500;">
              <option value="Portugal">Portugal</option>
            </select>
          </div>
        </div>

        <div class="grid-2" style="margin-top: 16px;">
          <div>
            <input type="text" id="codigo_postal" placeholder="Código Postal" required>
          </div>
          <div>
            <input type="text" id="cidade" placeholder="Cidade" required>
          </div>
        </div>
      </div>

      <!-- Produto(s) Vendido(s) -->
      <div class="form-card">
        <h2>Produto(s) Vendido(s)</h2>
        <div id="produtos-container">
          <div class="product-item">
            <div class="product-row">
              <input type="number" class="p-qtd" placeholder="1" value="1" min="1" required>
              <input type="text" class="p-sku" placeholder="SKU / Ref">
              <input type="text" class="p-modelo" placeholder="Marca, Modelo e Cor" required>
              <input type="text" class="p-tamanho" placeholder="Tamanho">
              <input type="number" step="0.01" class="p-valor" placeholder="Valor (€)" required>
            </div>
            <label class="checkbox-label">
              <input type="checkbox" class="p-declaracao" required style="width: 16px; height: 16px;">
              <span>Declaro que sou um vendedor particular e que os produtos vendidos são bens usados, não tendo sido liquidado IVA nesta venda</span>
            </label>
          </div>
        </div>

        <button type="button" id="btn-adicionar-produto" class="btn-secondary">+ Adicionar Outro Produto</button>
      </div>

      <!-- Assinatura Digital -->
      <div class="form-card">
        <h2>Assinatura Digital</h2>
        
        <div class="sig-date-row">
          <span style="font-size: 14px; font-weight: 600; color: var(--text-main);">Data da Declaração:</span>
          <div class="date-group">
            <input type="date" id="data_declaracao" required>
          </div>
        </div>
        
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">Desenhe a sua assinatura no espaço abaixo:</p>
        
        <div class="canvas-container">
          <canvas id="signature-pad"></canvas>
        </div>
        
        <button type="button" id="btn-limpar-assinatura" class="btn-small">Limpar Assinatura</button>
      </div>

      <button type="submit" id="btn-submeter" class="btn-primary">Submeter Declaração Oficial</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
