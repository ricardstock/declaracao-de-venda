<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declaração de Venda</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/country-select-js/2.1.1/css/countrySelect.min.css"/>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="page-wrapper">
    <header class="main-header">
      <div class="logo-area">
        <h1 id="txt-title">Declaração de Venda</h1>
      </div>
      <div class="lang-selector">
        <span>🌐</span>
        <select id="lang-select">
          <option value="pt">Português</option>
          <option value="en">English</option>
        </select>
      </div>
    </header>

    <div id="form-alert" class="form-alert hidden"></div>

    <form id="sale-form">
      <section class="form-card">
        <h2 id="txt-personal">Informações Pessoais</h2>
        <div class="grid-2">
          <input type="text" id="nome" placeholder="Nome Completo" required>
          <input type="text" id="nif" placeholder="NIF" required>
        </div>
        
        <div class="input-group-wrapper">
          <label class="field-label" id="lbl-phone">Contacto Telefónico</label>
          <div class="phone-container">
            <input type="tel" id="telefone" required>
          </div>
        </div>

        <input type="text" id="email" placeholder="Endereço de Email" required>
        <input type="text" id="morada" placeholder="Morada Completa" required>
        
        <div class="input-group-wrapper">
          <label class="field-label" id="lbl-country">País de Residência</label>
          <div class="country-container">
            <input type="text" id="pais" required>
          </div>
        </div>

        <div class="grid-2">
          <input type="text" id="codigo_postal" placeholder="Código Postal" required>
          <input type="text" id="cidade" placeholder="Cidade" required>
        </div>
      </section>

      <section class="form-card">
        <h2 id="txt-products">Produto(s) Vendido(s)</h2>
        <div id="products-list">
          <div class="product-item">
            <div class="product-row">
              <input type="number" class="p-qtd" placeholder="Qtd" value="1" min="1" required>
              <input type="text" class="p-sku" placeholder="SKU / Ref">
              <input type="text" class="p-modelo" placeholder="Marca, Modelo e Cor" required>
              <input type="text" class="p-tamanho" placeholder="Tamanho" required>
              <input type="number" step="0.01" class="p-valor" placeholder="Valor (€)" required>
            </div>
            <label class="checkbox-label">
              <input type="checkbox" class="p-consignacao" required> 
              <span class="txt-consignment">Declaro que sou um vendedor particular e que os produtos vendidos são bens usados, não tendo sido liquidado IVA nesta venda</span>
            </label>
          </div>
        </div>
        <button type="button" id="add-product-btn" class="btn-secondary">+ Adicionar Outro Produto</button>
      </section>

      <section class="form-card signature-section">
        <h2 id="txt-sig-title">Assinatura Digital</h2>
        
        <div class="sig-date-row">
          <div class="date-group">
            <label id="lbl-date" style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Data da Declaração:</label>
            <input type="date" id="data-declaracao" required>
          </div>
        </div>

        <p id="txt-sig-desc" style="margin-top: 15px;">Desenhe a sua assinatura no espaço abaixo:</p>
        <div class="canvas-container">
          <canvas id="signature-pad" width="600" height="180"></canvas>
        </div>
        <button type="button" id="clear-sig-btn" class="btn-small">Limpar Assinatura</button>
      </section>

      <button type="submit" id="btn-submit" class="btn-primary">Submeter Declaração Oficial</button>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/country-select-js/2.1.1/js/countrySelect.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
