<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declaração de Venda</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="form-container-main">
    <!-- Cabeçalho idêntico à estrutura do painel -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
      <h2>Declaração de Venda</h2>
      <select class="lang-select">
        <option>🌐 Português</option>
      </select>
    </div>

    <form id="declaracao-form">
      <!-- Secção 1: Informações Pessoais -->
      <div class="form-section">
        <h3>Informações Pessoais</h3>
        
        <div class="row-2">
          <input type="text" id="nome" placeholder="Nome Completo" required>
          <input type="text" id="nif" placeholder="NIF" required>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 6px; font-weight: 600;">Contacto Telefónico</label>
          <div class="input-addon-group">
            <div class="addon-box">
              <span>🇵🇹</span> <span>▾</span>
            </div>
            <input type="tel" id="telefone" placeholder="912 345 678" style="border: none; margin-bottom: 0; background: transparent;">
          </div>
        </div>

        <div style="margin-bottom: 15px;">
          <input type="email" id="email" placeholder="Endereço de Email">
        </div>

        <div style="margin-bottom: 15px;">
          <input type="text" id="morada" placeholder="Morada Completa" required>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 6px; font-weight: 600;">País de Residência</label>
          <div class="input-addon-group" style="padding: 0 12px; align-items: center; gap: 8px;">
            <span>🇵🇹</span>
            <select id="pais" style="border: none; background: transparent; width: 100%; outline: none; font-size: 14px; color: var(--text-main);">
              <option value="Portugal">Portugal</option>
            </select>
          </div>
        </div>

        <div class="row-2">
          <input type="text" id="codigo_postal" placeholder="Código Postal" required>
          <input type="text" id="cidade" placeholder="Cidade" required>
        </div>
      </div>

      <!-- Secção 2: Produto(s) Vendido(s) -->
      <div class="form-section">
        <h3>Produto(s) Vendido(s)</h3>
        <div id="produtos-container">
          <div class="produto-box-item">
            <div class="product-row-fields">
              <input type="number" class="p-qtd" placeholder="1" value="1" min="1" required>
              <input type="text" class="p-sku" placeholder="SKU / Ref">
              <input type="text" class="p-modelo" placeholder="Marca, Modelo e Cor" required>
              <input type="text" class="p-tamanho" placeholder="Tamanho">
              <input type="number" step="0.01" class="p-valor" placeholder="Valor (€)" required>
            </div>
            <label class="checkbox-line">
              <input type="checkbox" class="p-declaracao" required style="width: 16px; height: 16px;">
              <span>Declaro que sou um vendedor particular e que os produtos vendidos são bens usados, não tendo sido liquidado IVA nesta venda</span>
            </label>
          </div>
        </div>

        <button type="button" id="btn-adicionar-produto" class="btn-secondary">+ Adicionar Outro Produto</button>
      </div>

      <!-- Secção 3: Assinatura Digital -->
      <div class="form-section">
        <h3>Assinatura Digital</h3>
        
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 15px;">
          <span style="font-size: 14px; font-weight: 600; color: var(--text-main);">Data da Declaração:</span>
          <input type="date" id="data_declaracao" style="padding: 8px 12px; border: 1.5px solid var(--border-color); border-radius: 8px; background: #fafafa; outline: none;" required>
        </div>
        
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">Desenhe a sua assinatura no espaço abaixo:</p>
        
        <div class="canvas-container">
          <canvas id="signature-pad"></canvas>
        </div>
        
        <button type="button" id="btn-limpar-assinatura" class="btn-link-danger">Limpar Assinatura</button>
      </div>

      <button type="submit" id="btn-submeter" class="btn-primary">Submeter Declaração Oficial</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
