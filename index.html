<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declaração de Venda</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h2>Declaração de Venda de Artigos</h2>

    <form id="declaracao-form">
      <!-- VENDEDOR -->
      <h3>Dados do Vendedor</h3>
      <div class="form-group">
        <label>Nome Completo *</label>
        <input type="text" id="nome" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>NIF *</label>
          <input type="text" id="nif" required>
        </div>
        <div class="form-group">
          <label>Telefone / Telemóvel</label>
          <input type="tel" id="telefone">
        </div>
      </div>

      <div class="form-group">
        <label>Morada Completa *</label>
        <input type="text" id="morada" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Código Postal *</label>
          <input type="text" id="codigo_postal" placeholder="0000-000" required>
        </div>
        <div class="form-group">
          <label>Cidade *</label>
          <input type="text" id="cidade" required>
        </div>
        <div class="form-group">
          <label>País *</label>
          <input type="text" id="pais" value="Portugal" required>
        </div>
      </div>

      <!-- PRODUTOS -->
      <h3>Produto(s) Vendido(s)</h3>
      <div id="produtos-container">
        <!-- Linhas de produtos inseridas dinamicamente -->
      </div>

      <button type="button" id="btn-adicionar-produto" class="btn-secondary">+ Adicionar Outro Produto</button>

      <!-- DECLARAÇÃO ÚNICA GLOBAL NO FINAL DOS PRODUTOS -->
      <div class="declaracao-global-box" style="margin-top: 25px; margin-bottom: 20px; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;">
        <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 14px; color: #334155;">
          <input type="checkbox" id="declaracao-global" required style="margin-top: 3px; width: 18px; height: 18px;">
          <span>Declaro que sou unicamente um vendedor particular e que os produtos vendidos são bens usados, não tendo sido liquidado IVA nesta venda. (Obrigatório)</span>
        </label>
      </div>

      <!-- ASSINATURA -->
      <h3>Assinatura Digital</h3>
      <p style="font-size: 13px; color: #64748b; margin-bottom: 8px;">Assine no retângulo abaixo:</p>
      <div class="canvas-container">
        <canvas id="signature-pad" width="400" height="150"></canvas>
      </div>
      <button type="button" id="btn-limpar-assinatura" class="btn-link">Limpar Assinatura</button>

      <button type="submit" id="btn-submeter" class="btn-primary" style="margin-top: 20px;">Submeter Declaração</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://pwvjitzyxqxvvpmkfnlo.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3dmppdHp5eHF4dnZwbWtmbmxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MDYxNTAsImV4cCI6MjEwNzI4MjE1MH0.ctDJAzTRlzyBtSlmP8XiXTJjEOKEIUAHVnD9h8xQuuA";

    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ASSINATURA CANVAS
    const canvas = document.getElementById('signature-pad');
    const ctx = canvas ? canvas.getContext('2d') : null;
    let desenhando = false;
    let assinou = false;

    if (canvas) {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      ctx.scale(ratio, ratio);

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      function iniciarDesenho(e) {
        desenhando = true;
        assinou = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        if (e.type === 'touchstart') e.preventDefault();
      }

      function desenhar(e) {
        if (!desenhando) return;
        const pos = getPos(e);
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000000';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        if (e.type === 'touchmove') e.preventDefault();
      }

      function pararDesenho() {
        desenhando = false;
      }

      canvas.addEventListener('mousedown', iniciarDesenho);
      canvas.addEventListener('mousemove', desenhar);
      canvas.addEventListener('mouseup', pararDesenho);
      canvas.addEventListener('mouseleave', pararDesenho);

      canvas.addEventListener('touchstart', iniciarDesenho, { passive: false });
      canvas.addEventListener('touchmove', desenhar, { passive: false });
      canvas.addEventListener('touchend', pararDesenho);

      document.getElementById('btn-limpar-assinatura').addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        assinou = false;
      });
    }

    // GESTÃO DOS PRODUTOS
    const produtosContainer = document.getElementById('produtos-container');
    const btnAdicionarProduto = document.getElementById('btn-adicionar-produto');

    function criarLinhaProduto(index) {
      const div = document.createElement('div');
      div.className = 'produto-box';
      div.style.cssText = "background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 12px; position: relative;";
      
      div.innerHTML = `
        <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
          <input type="number" class="p-qtd" placeholder="Qt" value="1" min="1" style="width: 55px; padding: 8px;" required>
          <input type="text" class="p-sku" placeholder="SKU / Ref" style="width: 100px; padding: 8px;">
          <input type="text" class="p-modelo" placeholder="Marca, Modelo e Cor" style="flex: 2; min-width: 150px; padding: 8px;" required>
          <input type="text" class="p-tamanho" placeholder="Tamanho" style="width: 80px; padding: 8px;">
          <input type="number" step="0.01" class="p-valor" placeholder="Valor (€)" style="width: 90px; padding: 8px;" required>
          ${index > 0 ? '<button type="button" class="btn-remover" style="background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">X</button>' : ''}
        </div>
      `;

      if (index > 0) {
        div.querySelector('.btn-remover').addEventListener('click', () => {
          div.remove();
        });
      }

      produtosContainer.appendChild(div);
    }

    if (produtosContainer) {
      // Cria a primeira linha logo ao carregar a página
      criarLinhaProduto(0);

      btnAdicionarProduto.addEventListener('click', () => {
        const totalAtuais = produtosContainer.querySelectorAll('.produto-box').length;
        criarLinhaProduto(totalAtuais);
      });
    }

    // SUBMISSÃO DO FORMULÁRIO
    const form = document.getElementById('declaracao-form');

    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!assinou) {
          alert("Por favor, assine a declaração antes de submeter.");
          return;
        }

        const btnSubmeter = document.getElementById('btn-submeter');
        btnSubmeter.disabled = true;
        btnSubmeter.innerText = "A guardar declaração...";

        try {
          const dataURL = canvas.toDataURL('image/png');
          const blob = await (await fetch(dataURL)).blob();
          const filename = `assinaturas/ass_${Date.now()}_${Math.random().toString(36).substring(7)}.png`;

          const { data: uploadData, error: uploadError } = await sbClient.storage
            .from('declaracoes_docs')
            .upload(filename, blob);

          if (uploadError) throw uploadError;

          const { data: urlData } = sbClient.storage
            .from('declaracoes_docs')
            .getPublicUrl(filename);

          const assinatura_url = urlData.publicUrl;

          const produtos = [];
          document.querySelectorAll('.produto-box').forEach(box => {
            produtos.push({
              qtd: box.querySelector('.p-qtd').value,
              sku: box.querySelector('.p-sku').value,
              modelo: box.querySelector('.p-modelo').value,
              tamanho: box.querySelector('.p-tamanho').value,
              valor: box.querySelector('.p-valor').value
            });
          });

          const hoje = new Date().toISOString().split('T')[0];

          const payload = {
            nome: document.getElementById('nome').value,
            nif: document.getElementById('nif').value,
            telefone: document.getElementById('telefone').value,
            morada: document.getElementById('morada').value,
            codigo_postal: document.getElementById('codigo_postal').value,
            cidade: document.getElementById('cidade').value,
            pais: document.getElementById('pais').value,
            produtos: produtos,
            assinatura_url: assinatura_url,
            data_declaracao: hoje
          };

          const { error: insertError } = await sbClient
            .from('declaracoes')
            .insert([payload]);

          if (insertError) throw insertError;

          alert("Declaração submetida com sucesso! Obrigado.");
          window.location.reload();

        } catch (err) {
          console.error(err);
          alert("Erro ao submeter declaração: " + err.message);
          btnSubmeter.disabled = false;
          btnSubmeter.innerText = "Submeter Declaração";
        }
      });
    }
  </script>
</body>
</html>
