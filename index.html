<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declaração de Venda</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <main class="page-wrapper">
    <!-- Cabeçalho isolado -->
    <header class="main-header">
      <h1>Declaração de Venda</h1>
      <div class="lang-selector">
        <select id="lang-select">
          <option value="pt">🌐 Português</option>
        </select>
      </div>
    </header>

    <div id="form-alert" class="form-alert hidden" role="alert" tabindex="-1"></div>

    <form id="declaracao-form">
      <!-- Cartão 1: Informações Pessoais -->
      <section class="form-card">
        <h2>Informações Pessoais</h2>
        
        <div class="grid-2">
          <div>
            <label class="field-label" for="nome">Nome Completo *</label>
            <input id="nome" type="text" placeholder="Nome Completo" autocomplete="name" required>
          </div>
          <div>
            <label class="field-label" for="nif">NIF *</label>
            <input id="nif" type="text" placeholder="NIF" required>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label class="field-label" for="telefone">Contacto Telefónico</label>
            <div class="phone-input-group">
              <span class="flag-icon">🇵🇹 ▾</span>
              <input id="telefone" type="tel" placeholder="912 345 678" autocomplete="tel">
            </div>
          </div>
          <div>
            <label class="field-label" for="email">Endereço de Email</label>
            <input id="email" type="email" placeholder="Endereço de Email" autocomplete="email">
          </div>
        </div>

        <div>
          <label class="field-label" for="morada">Morada Completa *</label>
          <input id="morada" type="text" placeholder="Morada Completa" autocomplete="street-address" required>
        </div>

        <div>
          <label class="field-label" for="pais">País de Residência *</label>
          <div class="country-input-group">
            <span class="flag-icon">🇵🇹</span>
            <input id="pais" type="text" value="Portugal" autocomplete="country-name" required>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label class="field-label" for="codigo_postal">Código Postal *</label>
            <input id="codigo_postal" type="text" placeholder="Código Postal" autocomplete="postal-code" required>
          </div>
          <div>
            <label class="field-label" for="cidade">Cidade *</label>
            <input id="cidade" type="text" placeholder="Cidade" autocomplete="address-level2" required>
          </div>
        </div>
      </section>

      <!-- Cartão 2: Produto(s) Vendido(s) -->
      <section class="form-card">
        <h2>Produto(s) Vendido(s)</h2>
        <div id="produtos-container"></div>
        
        <button type="button" id="btn-adicionar-produto" class="btn-secondary">+ Adicionar Outro Produto</button>

        <div class="declaracao-global-box">
          <label class="checkbox-label">
            <input type="checkbox" id="declaracao-global" required>
            <span>Declaro que sou unicamente um vendedor particular e que os produtos vendidos são bens usados, não tendo sido liquidado IVA nesta venda. (Obrigatório)</span>
          </label>
        </div>
      </section>

      <!-- Cartão 3: Assinatura Digital -->
      <section class="form-card">
        <h2>Assinatura Digital</h2>
        
        <div class="sig-date-row">
          <div class="date-group">
            <label class="field-label" for="data_declaracao">Data da declaração *</label>
            <input id="data_declaracao" type="date" required>
          </div>
        </div>

        <p class="signature-help">Desenhe a sua assinatura no espaço abaixo:</p>
        
        <div class="canvas-container">
          <canvas id="signature-pad" aria-label="Área para desenhar a assinatura"></canvas>
        </div>

        <button type="button" id="btn-limpar-assinatura" class="btn-small">Limpar Assinatura</button>
      </section>

      <button type="submit" id="btn-submeter" class="btn-primary">Submeter Declaração Oficial</button>
    </form>
  </main>
</body>
</html>
