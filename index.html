<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declaração de Venda</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>Declaração de Venda</h2>
      <select style="padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff;">
        <option>🌐 Português</option>
      </select>
    </div>

    <form id="declaracao-form">
      <!-- Informações Pessoais (Estrutura original da foto) -->
      <h3>Informações Pessoais</h3>
      
      <div style="display: flex; gap: 10px; margin-bottom: 12px;">
        <input type="text" id="nome" placeholder="Nome Completo" style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;" required>
        <input type="text" id="nif" placeholder="NIF" style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;" required>
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 13px; color: #64748b; display: block; margin-bottom: 4px;">Contacto Telefónico</label>
        <div style="display: flex; border: 1px solid #cbd5e1; border-radius: 6px; overflow: hidden; background: #fff;">
          <div style="padding: 10px; background: #f8fafc; border-right: 1px solid #cbd5e1; display: flex; align-items: center; gap: 5px;">
            <span>🇵🇹</span> ▾
          </div>
          <input type="tel" id="telefone" placeholder="912 345 678" style="flex: 1; border: none; padding: 10px; outline: none;">
        </div>
      </div>

      <div style="margin-bottom: 12px;">
        <input type="email" id="email" placeholder="Endereço de Email" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 12px;">
        <input type="text" id="morada" placeholder="Morada Completa" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" required>
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 13px; color: #64748b; display: block; margin-bottom: 4px;">País de Residência</label>
        <div style="display: flex; border: 1px solid #cbd5e1; border-radius: 6px; overflow: hidden; background: #fff; padding: 10px;">
          <span>🇵🇹 Portugal ▾</span>
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <input type="text" id="codigo_postal" placeholder="Código Postal" style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;" required>
        <input type="text" id="cidade" placeholder="Cidade" style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;" required>
      </div>

      <!-- Produto(s) Vendido(s) com a caixa de declaração única no final -->
      <h3>Produto(s) Vendido(s)</h3>
      <div id="produtos-container">
        <div class="produto-box" style="background: #fff; border: 1px solid #cbd5e1; padding: 15px; border-radius: 8px; margin-bottom: 12px;">
          <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <input type="number" class="p-qtd" placeholder="1" value="1" min="1" style="width: 60px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;" required>
            <input type="text" class="p-sku" placeholder="SKU / Ref" style="width: 110px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
            <input type="text" class="p-modelo" placeholder="Marca, Modelo e Cor" style="flex: 1; min-width: 180px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;" required>
            <input type="text" class="p-tamanho" placeholder="Tamanho" style="width: 90px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
            <input type="number" step="0.01" class="p-valor" placeholder="Valor (€)" style="width: 100px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;" required>
          </div>
        </div>
      </div>

      <button type="button" id="btn-adicionar-produto" class="btn-secondary" style="margin-bottom: 20px; padding: 10px 15px; background: #e2e8f0; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">+ Adicionar Outro Produto</button>

      <!-- DECLARAÇÃO ÚNICA GLOBAL NO FINAL DOS PRODUTOS (Substituiu os checkboxes individuais) -->
      <div class="declaracao-global-box" style="padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 25px;">
        <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 14px; color: #334155;">
          <input type="checkbox" id="declaracao-global" required style="margin-top: 3px; width: 18px; height: 18px;">
          <span>Declaro que sou um vendedor particular e que os produtos vendidos são bens usados, não tendo sido liquidado IVA nesta venda.</span>
        </label>
      </div>

      <!-- Assinatura Digital (Estrutura original da foto) -->
      <h3>Assinatura Digital</h3>
      <div style="margin-bottom: 12px; display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 14px; color: #334155;">Data da Declaração:</span>
        <input type="date" id="data_declaracao" style="padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;" required>
      </div>
      
      <p style="font-size: 13px; color: #64748b; margin-bottom: 8px;">Desenhe a sua assinatura no espaço abaixo:</p>
      
      <div class="canvas-container" style="border: 2px dashed #cbd5e1; border-radius: 8px; background: #fff;">
        <canvas id="signature-pad" style="width: 100%; height: 150px; display: block;"></canvas>
      </div>
      
      <button type="button" id="btn-limpar-assinatura" class="btn-link" style="background: none; border: none; color: #ef4444; padding: 8px 0; cursor: pointer; margin-top: 5px; margin-bottom: 20px;">Limpar Assinatura</button>

      <button type="submit" id="btn-submeter" class="btn-primary" style="width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;">Submeter Declaração Oficial</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
