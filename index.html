<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Declaração de Venda</title><link rel="stylesheet" href="style.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="script.js"></script>
</head>
<body><main class="page-wrapper">
<header class="main-header"><h1>Declaração de Venda de Artigos</h1></header>
<div id="form-alert" class="form-alert hidden" role="alert" tabindex="-1"></div>
<form id="declaracao-form">
<section class="form-card"><h2>Dados do Vendedor</h2>
<label class="field-label" for="nome">Nome Completo *</label><input id="nome" type="text" autocomplete="name" required>
<div class="grid-2"><div><label class="field-label" for="nif">NIF *</label><input id="nif" type="text" required></div><div><label class="field-label" for="telefone">Telefone / Telemóvel</label><input id="telefone" type="tel" autocomplete="tel"></div></div>
<label class="field-label" for="morada">Morada Completa *</label><input id="morada" type="text" autocomplete="street-address" required>
<div class="grid-2"><div><label class="field-label" for="codigo_postal">Código Postal *</label><input id="codigo_postal" type="text" placeholder="0000-000" autocomplete="postal-code" required></div><div><label class="field-label" for="cidade">Cidade *</label><input id="cidade" type="text" autocomplete="address-level2" required></div></div>
<label class="field-label" for="pais">País *</label><input id="pais" type="text" value="Portugal" autocomplete="country-name" required>
</section>
<section class="form-card"><h2>Produto(s) Vendido(s)</h2><div id="produtos-container"></div><button type="button" id="btn-adicionar-produto" class="btn-secondary">+ Adicionar Outro Produto</button>
<div class="declaracao-global-box"><label class="checkbox-label"><input type="checkbox" id="declaracao-global" required><span>Declaro que sou unicamente um vendedor particular e que os produtos vendidos são bens usados, não tendo sido liquidado IVA nesta venda. (Obrigatório)</span></label></div>
</section>
<section class="form-card"><h2>Assinatura Digital</h2><div class="sig-date-row"><div class="date-group"><label class="field-label" for="data_declaracao">Data da declaração *</label><input id="data_declaracao" type="date" required></div></div><p class="signature-help">Assine no retângulo abaixo:</p><div class="canvas-container"><canvas id="signature-pad" aria-label="Área para desenhar a assinatura"></canvas></div><button
